name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goVer: ['1.27']
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
  
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.goVer }}
   
    - name: Test
      run: go test -v ./...

  # Replays the manual walkthrough documented in README.md, plus the endpoints
  # added on top of it, against a real Vault dev server. The plugin is proven to
  # load and serve requests over the plugin RPC protocol instead of only being
  # exercised in-process by unit tests.
  #
  # The same job runs the REST API test, because that one needs exactly the same
  # dev server with the plugin already mounted.
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build
    env:
      VAULT_VERSION: "2.1.1"
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root
      GMSM_MOUNT: gmsm
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Build plugin
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/plugin-build" "$RUNNER_TEMP/plugins"
        CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/plugin-build/vault-gmsm-plugin" .

    - name: Install Vault
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/vault.zip" \
          "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
        unzip -q -o "$RUNNER_TEMP/vault.zip" -d "$RUNNER_TEMP/vault-bin"
        echo "$RUNNER_TEMP/vault-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/vault-bin/vault" version

    - name: Start Vault dev server
      run: |
        set -euo pipefail
        # Vault 2.x dev mode probes every binary in -dev-plugin-dir at startup and
        # aborts when one is not a database plugin, so the directory has to stay
        # empty here; the plugin binary is copied in once the server is up.
        nohup vault server -dev -dev-root-token-id=root \
          -dev-plugin-dir="$RUNNER_TEMP/plugins" -log-level=info > "$RUNNER_TEMP/vault.log" 2>&1 &
        for _ in $(seq 1 30); do
          if curl -fsS "$VAULT_ADDR/v1/sys/health" > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo '::error::vault dev server did not become ready'
        cat "$RUNNER_TEMP/vault.log"
        exit 1

    - name: Run README walkthrough
      run: |
        set -euo pipefail
        plugin_bin="$RUNNER_TEMP/plugins/vault-gmsm-plugin"
        cp "$RUNNER_TEMP/plugin-build/vault-gmsm-plugin" "$plugin_bin"
        chmod 0755 "$plugin_bin"

        # README steps 5-6: register the plugin by its checksum and mount it.
        vault plugin register -sha256="$(sha256sum "$plugin_bin" | cut -d' ' -f1)" secret vault-gmsm-plugin
        vault plugin info secret vault-gmsm-plugin
        vault secrets enable -path=gmsm vault-gmsm-plugin

        plaintext=$(printf 'my secret data' | base64)

        # README steps 7-9: sm4-gcm96 key creation, encryption and decryption.
        vault write -f gmsm/keys/mykey
        ciphertext=$(vault write -field=ciphertext gmsm/encrypt/mykey plaintext="$plaintext")
        echo "ciphertext: $ciphertext"
        [[ $ciphertext == vault:v1:* ]]
        [ "$(vault write -field=plaintext gmsm/decrypt/mykey ciphertext="$ciphertext")" = "$plaintext" ]

        # README steps 10-11: rotate, then rewrap the v1 ciphertext to v2.
        vault write -f gmsm/keys/mykey/rotate
        [ "$(vault read -field=latest_version gmsm/keys/mykey)" = "2" ]
        rewrapped=$(vault write -field=ciphertext gmsm/rewrap/mykey ciphertext="$ciphertext")
        echo "rewrapped: $rewrapped"
        [[ $rewrapped == vault:v2:* ]]
        [ "$(vault write -field=plaintext gmsm/decrypt/mykey ciphertext="$rewrapped")" = "$plaintext" ]

        # sm2: encrypt, decrypt, read the key, sign and verify.
        vault write -f gmsm/keys/sm2-key type=sm2
        sm2_ciphertext=$(vault write -field=ciphertext gmsm/encrypt/sm2-key plaintext="$plaintext")
        [[ $sm2_ciphertext == vault:v1:* ]]
        [ "$(vault write -field=plaintext gmsm/decrypt/sm2-key ciphertext="$sm2_ciphertext")" = "$plaintext" ]
        vault read gmsm/keys/sm2-key
        signature=$(vault write -field=signature gmsm/sign/sm2-key input="$plaintext")
        [[ $signature == vault:v1:* ]]
        [ "$(vault write -field=valid gmsm/verify/sm2-key input="$plaintext" signature="$signature")" = "true" ]
        # The same signature must not verify a different input.
        tampered=$(printf 'tampered data' | base64)
        [ "$(vault write -field=valid gmsm/verify/sm2-key input="$tampered" signature="$signature")" = "false" ]

    # The endpoints added on top of the README walkthrough: the certificate pair
    # and the SM2 user identifier. Every check names itself and prints what it
    # saw, because a bare [ ... = ... ] turns a wrong answer into a red step that
    # explains nothing.
    - name: Run certificate and identifier walkthrough
      run: |
        set -euo pipefail

        # The server's own message is already in the log, so the annotation only
        # has to name the command that broke the step. Wrapping vault to capture
        # its stderr would hide that message from a caller that redirects it.
        trap 'echo "::error::failed: ${BASH_COMMAND:0:200}"' ERR

        fail() {
          echo "::error::$1"
          exit 1
        }

        expect() {
          [ "${3-}" = "$2" ] || fail "$1: got '${3-}', want '$2'"
        }

        plaintext=$(printf 'my secret data' | base64)

        # The plugin signs the request with the key it stores, an external CA
        # signs that request, and the chain is stored back on the key version.
        vault write -field=csr gmsm/keys/sm2-key/csr version=1 > "$RUNNER_TEMP/request.pem"
        grep -q 'BEGIN CERTIFICATE REQUEST' "$RUNNER_TEMP/request.pem" \
          || fail "the key endpoint did not return a PEM request: $(cat "$RUNNER_TEMP/request.pem")"

        go run ./scripts/ci/sm2ca -csr "$RUNNER_TEMP/request.pem" -out "$RUNNER_TEMP/chain.pem" \
          || fail "the test CA could not sign the request"

        vault write gmsm/keys/sm2-key/set-certificate version=1 \
          certificate_chain="$(cat "$RUNNER_TEMP/chain.pem")"

        # Both the leaf and the CA have to come back from the export, otherwise
        # a client cannot build the chain it was handed.
        vault read -format=json gmsm/export/certificate-chain/sm2-key > "$RUNNER_TEMP/export.json"
        certificates=$(grep -o 'BEGIN CERTIFICATE' "$RUNNER_TEMP/export.json" | wc -l || true)
        [ "$certificates" = "2" ] \
          || fail "the export holds $certificates certificates, want 2: $(cat "$RUNNER_TEMP/export.json")"

        # A chain that belongs to another key must be refused, otherwise the
        # export would attest a key the plugin does not hold.
        vault write gmsm/keys/foreign-key type=sm2 > /dev/null
        vault write -field=csr gmsm/keys/foreign-key/csr version=1 > "$RUNNER_TEMP/foreign.pem"
        go run ./scripts/ci/sm2ca -csr "$RUNNER_TEMP/foreign.pem" -out "$RUNNER_TEMP/foreign-chain.pem" > /dev/null \
          || fail "the test CA could not sign the foreign request"

        if foreign=$(vault write gmsm/keys/sm2-key/set-certificate version=1 \
            certificate_chain="$(cat "$RUNNER_TEMP/foreign-chain.pem")" 2>&1); then
          fail "a certificate chain of another key was accepted"
        fi
        case $foreign in
          *"does not match the key version selected"*) ;;
          *) fail "the foreign chain was rejected for an unexpected reason: $foreign" ;;
        esac

        # Only the key types that sign can carry a certificate, and mykey is
        # sm4-gcm96 from the README walkthrough.
        if symmetric=$(vault write gmsm/keys/mykey/csr version=1 2>&1); then
          fail "a symmetric key produced a certificate request"
        fi
        case $symmetric in
          *"does not support certificates"*) ;;
          *) fail "the symmetric key was rejected for an unexpected reason: $symmetric" ;;
        esac

        # The identifier is part of the Z value the signature covers, so a
        # signature only verifies with the identifier it was created with.
        identified=$(vault write -field=signature gmsm/sign/sm2-key input="$plaintext" uid=alice@example.com)
        case $identified in
          vault:v1:*) ;;
          *) fail "signing returned '$identified' instead of a vault:v1 signature" ;;
        esac

        expect "verify with the identifier that signed" true \
          "$(vault write -field=valid gmsm/verify/sm2-key input="$plaintext" signature="$identified" uid=alice@example.com)"
        expect "verify without an identifier" false \
          "$(vault write -field=valid gmsm/verify/sm2-key input="$plaintext" signature="$identified")"
        expect "verify with another identifier" false \
          "$(vault write -field=valid gmsm/verify/sm2-key input="$plaintext" signature="$identified" uid=bob@example.com)"

    # Key import, which the README documents separately from the walkthrough:
    # exported material has to be accepted back unchanged, a public-only import
    # verifies but does not sign, and the version rules are the transit ones.
    - name: Run import walkthrough
      run: |
        set -euo pipefail

        trap 'echo "::error::failed: ${BASH_COMMAND:0:200}"' ERR

        fail() {
          echo "::error::$1"
          exit 1
        }

        expect() {
          [ "${3-}" = "$2" ] || fail "$1: got '${3-}', want '$2'"
        }

        plaintext=$(printf 'my secret data' | base64)

        # Material can only be exported when the key was created exportable.
        vault write -f gmsm/keys/exportable-key type=sm2 exportable=true > /dev/null
        signature=$(vault write -field=signature gmsm/sign/exportable-key input="$plaintext")

        vault read -format=json gmsm/export/signing-key/exportable-key/latest \
          | jq -r '.data.keys["1"]' > "$RUNNER_TEMP/signing-key.pem"
        grep -q 'BEGIN EC PRIVATE KEY' "$RUNNER_TEMP/signing-key.pem" \
          || fail "export did not return an SEC 1 private key: $(cat "$RUNNER_TEMP/signing-key.pem")"

        # An import that misses a field only warns: the create path upserts and the
        # walkthrough would go on to test a generated key. Keeping the output turns
        # that into a failure at the line that caused it.
        import_write() {
          local out
          out=$(vault write -f "$@" 2>&1) || fail "an import was refused: $out"
          case $out in
            *unrecognized*) fail "an import endpoint ignored a parameter: $out" ;;
          esac
        }

        # What export produces has to go straight back into import.
        import_write gmsm/keys/imported-key/import type=sm2 \
          private_key=@"$RUNNER_TEMP/signing-key.pem"
        expect "an imported key reports itself as imported" true \
          "$(vault read -field=imported_key gmsm/keys/imported-key)"

        # The type was renamed from ecdsa-sm2, which still has to be accepted.
        vault write -f gmsm/keys/legacy-name-key type=ecdsa-sm2 > /dev/null
        expect "the old type name is accepted and reported as sm2" sm2 \
          "$(vault read -field=type gmsm/keys/legacy-name-key)"

        # A re-import is the same key, so signatures cross over both ways.
        expect "a signature of the original verifies against the copy" true \
          "$(vault write -field=valid gmsm/verify/imported-key input="$plaintext" signature="$signature")"
        copied=$(vault write -field=signature gmsm/sign/imported-key input="$plaintext")
        expect "a signature of the copy verifies against the original" true \
          "$(vault write -field=valid gmsm/verify/exportable-key input="$plaintext" signature="$copied")"

        # import creates, it does not extend an existing key.
        if duplicate=$(vault write gmsm/keys/imported-key/import type=sm2 \
            private_key=@"$RUNNER_TEMP/signing-key.pem" 2>&1); then
          fail "a second import of the same name was accepted"
        fi
        case $duplicate in
          *"already exists"*) ;;
          *) fail "the duplicate import failed for an unexpected reason: $duplicate" ;;
        esac

        # A key generated by Vault refuses imported material.
        if generated=$(vault write gmsm/keys/exportable-key/import_version \
            private_key=@"$RUNNER_TEMP/signing-key.pem" 2>&1); then
          fail "a key generated by Vault accepted imported material"
        fi
        case $generated in
          *"generated by Vault"*) ;;
          *) fail "the generated key was refused for an unexpected reason: $generated" ;;
        esac

        # The public half alone verifies signatures it did not make, and cannot
        # make them.
        vault read -format=json gmsm/export/public-key/exportable-key/latest \
          | jq -r '.data.keys["1"]' > "$RUNNER_TEMP/public-key.pem"
        import_write gmsm/keys/public-only-key/import type=sm2 \
          public_key=@"$RUNNER_TEMP/public-key.pem"
        expect "a public-only import verifies a signature made elsewhere" true \
          "$(vault write -field=valid gmsm/verify/public-only-key input="$plaintext" signature="$signature")"
        if signed=$(vault write gmsm/sign/public-only-key input="$plaintext" 2>&1); then
          fail "a public-only key produced a signature"
        fi
        case $signed in
          *"does not contain a private part"*) ;;
          *) fail "the public-only key failed to sign for an unexpected reason: $signed" ;;
        esac

        # Rotation stays off until the import allows it.
        if rotated=$(vault write -f gmsm/keys/imported-key/rotate 2>&1); then
          fail "an imported key was rotated although the import did not allow it"
        fi
        case $rotated in
          *"rotation is not allowed"*) ;;
          *) fail "the rotation was refused for an unexpected reason: $rotated" ;;
        esac

        # Once rotation is allowed and used, the ring holds a generated version
        # and import_version has to refuse further material.
        import_write gmsm/keys/rotatable-key/import type=sm2 \
          private_key=@"$RUNNER_TEMP/signing-key.pem" allow_rotation=true
        vault write -f gmsm/keys/rotatable-key/rotate > /dev/null
        if spliced=$(vault write gmsm/keys/rotatable-key/import_version \
            private_key=@"$RUNNER_TEMP/signing-key.pem" 2>&1); then
          fail "material was imported into a key that had already been rotated"
        fi
        case $spliced in
          *"no longer accepts imported material"*) ;;
          *) fail "the post-rotation import failed for an unexpected reason: $spliced" ;;
        esac

    # The REST test speaks to the same server over HTTP, so it catches what the
    # CLI hides: status codes, JSON key names and the shape of error responses.
    - name: Run REST API integration test
      run: go test -count=1 -run TestRESTAPI -v ./gmsm

    - name: Dump Vault server log
      if: always()
      run: |
        cat "$RUNNER_TEMP/vault.log" || true
        pkill -f "vault server -dev" || true

  # The pki plugin is a second plugin with a mount type of its own, so it gets a
  # dev server of its own as well. The unit tests already sign and verify in
  # process; what this job adds is the plugin RPC hop, the HTTP shapes of the raw
  # certificate and CRL answers, and the storage of a real Vault server.
  integration-pki:
    name: PKI Integration Test
    runs-on: ubuntu-latest
    needs: build
    env:
      VAULT_VERSION: "2.1.1"
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root
      PKI_MOUNT: pki-gmsm
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Build plugin
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/plugin-build" "$RUNNER_TEMP/plugins"
        CGO_ENABLED=0 go build -trimpath \
          -o "$RUNNER_TEMP/plugin-build/pki-gmsm" ./cmd/pki-gmsm

    - name: Install Vault
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/vault.zip" \
          "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
        unzip -q -o "$RUNNER_TEMP/vault.zip" -d "$RUNNER_TEMP/vault-bin"
        echo "$RUNNER_TEMP/vault-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/vault-bin/vault" version

    - name: Start Vault dev server
      run: |
        set -euo pipefail
        # Vault 2.x dev mode probes every binary in -dev-plugin-dir at startup and
        # aborts when one is not a database plugin, so the directory has to stay
        # empty here; the plugin binary is copied in once the server is up.
        nohup vault server -dev -dev-root-token-id=root \
          -dev-plugin-dir="$RUNNER_TEMP/plugins" -log-level=info > "$RUNNER_TEMP/vault.log" 2>&1 &
        for _ in $(seq 1 30); do
          if curl -fsS "$VAULT_ADDR/v1/sys/health" > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo '::error::vault dev server did not become ready'
        cat "$RUNNER_TEMP/vault.log"
        exit 1

    - name: Run PKI walkthrough
      run: |
        set -euo pipefail

        trap 'echo "::error::failed: ${BASH_COMMAND:0:200}"' ERR

        fail() {
          echo "::error::$1"
          exit 1
        }

        expect() {
          [ "${3-}" = "$2" ] || fail "$1: got '${3-}', want '$2'"
        }

        # Vault looks for a file named exactly after the registered plugin name,
        # so the binary is copied in as pki-gmsm and registered as pki-gmsm.
        plugin_bin="$RUNNER_TEMP/plugins/pki-gmsm"
        cp "$RUNNER_TEMP/plugin-build/pki-gmsm" "$plugin_bin"
        chmod 0755 "$plugin_bin"
        vault plugin register -sha256="$(sha256sum "$plugin_bin" | cut -d' ' -f1)" secret pki-gmsm
        vault secrets enable -path="$PKI_MOUNT" pki-gmsm

        # The role is looked up first, because it is what says whether the
        # request may be built at all; a mount with neither refuses there.
        if out=$(vault write "$PKI_MOUNT/issue/web" common_name=web.example.com 2>&1); then
          fail "a mount without a role issued a certificate"
        fi
        case $out in
          *'role "web" does not exist'*) ;;
          *) fail "the missing role was reported as: $out" ;;
        esac

        # A role is policy rather than state of the authority, so it can be
        # written to a mount that has no authority yet; issuing then fails on the
        # authority, and says what to do about it.
        vault write "$PKI_MOUNT/roles/web" allowed_domains=example.com allow_subdomains=true \
          ttl=24h max_ttl=720h > /dev/null

        if out=$(vault write "$PKI_MOUNT/issue/web" common_name=web.example.com 2>&1); then
          fail "a mount without an authority issued a certificate"
        fi
        case $out in
          *"no certificate authority is configured"*) ;;
          *) fail "the missing authority was reported as: $out" ;;
        esac

        # The authority is generated once, and an internal one keeps its key. The
        # answer is parsed below, so it has to be asked for as JSON; the default
        # is the table the CLI prints.
        vault write -format=json "$PKI_MOUNT/root/generate/internal" \
          common_name="Test Root CA" organization=Acme ttl=8760h > "$RUNNER_TEMP/root.json"
        root_serial=$(jq -r '.data.serial_number // empty' "$RUNNER_TEMP/root.json")
        [ -n "$root_serial" ] || fail "root/generate returned no serial: $(cat "$RUNNER_TEMP/root.json")"
        [ -z "$(jq -r '.data.private_key // empty' "$RUNNER_TEMP/root.json")" ] \
          || fail "an internal authority returned its private key"
        vault read "$PKI_MOUNT/ca" > /dev/null
        curl -fsS -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/$PKI_MOUNT/ca/pem" \
          | grep -q 'BEGIN CERTIFICATE' || fail "ca/pem is not a PEM certificate"

        if second=$(vault write "$PKI_MOUNT/root/generate/internal" common_name="Second Root" 2>&1); then
          fail "a second authority was generated in the same mount"
        fi
        case $second in
          *"already holds a certificate authority"*) ;;
          *) fail "the second authority was refused as: $second" ;;
        esac

        # The role decides what may be issued; the refusal names the policy.
        if out=$(vault write "$PKI_MOUNT/issue/web" common_name=web.other.com 2>&1); then
          fail "a name outside the role was issued"
        fi
        case $out in
          *"is not allowed by this role"*) ;;
          *) fail "the refused name was reported as: $out" ;;
        esac

        vault write -format=json "$PKI_MOUNT/issue/web" \
          common_name=web.example.com alt_names=api.example.com ip_sans=10.0.0.1 \
          > "$RUNNER_TEMP/leaf.json"
        leaf_serial=$(jq -r '.data.serial_number // empty' "$RUNNER_TEMP/leaf.json")
        [ -n "$leaf_serial" ] || fail "issue returned no serial: $(cat "$RUNNER_TEMP/leaf.json")"
        jq -r '.data.certificate' "$RUNNER_TEMP/leaf.json" > "$RUNNER_TEMP/leaf.pem"
        jq -r '.data.issuing_ca' "$RUNNER_TEMP/leaf.json" > "$RUNNER_TEMP/ca.pem"
        jq -r '.data.private_key' "$RUNNER_TEMP/leaf.json" \
          | grep -q 'BEGIN EC PRIVATE KEY' || fail "issue returned no SEC 1 private key"

        # Neither the CLI nor the certificate tooling of a runner parses an SM2
        # signed certificate, so the signature is checked in this module.
        go run ./scripts/ci/pkicheck -cert "$RUNNER_TEMP/leaf.pem" -ca "$RUNNER_TEMP/ca.pem" \
          || fail "the issued certificate does not verify against its authority"

        expect "cert/:serial reports the serial" "$leaf_serial" \
          "$(vault read -field=serial_number "$PKI_MOUNT/cert/$leaf_serial")"
        expect "the listing holds the serial" "$leaf_serial" \
          "$(vault list -format=json "$PKI_MOUNT/certs" | jq -r '.[0]')"

        # Revocation is recorded on the certificate and reaches the CRL.
        vault write "$PKI_MOUNT/revoke" serial_number="$leaf_serial" > /dev/null
        revoked=$(vault read -field=revocation_time "$PKI_MOUNT/cert/$leaf_serial")
        [ "${revoked:-0}" -gt 0 ] || fail "the revoked certificate reports revocation_time '$revoked'"

        crl_number=$(vault read -field=number "$PKI_MOUNT/crl")
        curl -fsS -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/$PKI_MOUNT/crl/pem" \
          | grep -q 'BEGIN X509 CRL' || fail "crl/pem is not a PEM certificate revocation list"
        der_type=$(curl -fsS -o "$RUNNER_TEMP/crl.der" -w '%{content_type}' \
          -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/$PKI_MOUNT/crl/der")
        case $der_type in
          application/pkix-crl*) ;;
          *) fail "crl/der answered with content type '$der_type'" ;;
        esac

        # Rotation takes no parameters, and the CLI refuses a write with no data
        # unless it is forced.
        vault write -f "$PKI_MOUNT/crl/rotate" > /dev/null
        expect "rotating the CRL increments its number" "$((crl_number + 1))" \
          "$(vault read -field=number "$PKI_MOUNT/crl")"

        # The distribution point the certificates will name is stored and read back.
        vault write "$PKI_MOUNT/config/urls" \
          issuing_certificates="$VAULT_ADDR/v1/$PKI_MOUNT/ca" \
          crl_distribution_points="$VAULT_ADDR/v1/$PKI_MOUNT/crl" > /dev/null
        vault read -format=json "$PKI_MOUNT/config/urls" > "$RUNNER_TEMP/urls.json"
        grep -qF "$VAULT_ADDR/v1/$PKI_MOUNT/crl" "$RUNNER_TEMP/urls.json" \
          || fail "config/urls did not keep the distribution point: $(cat "$RUNNER_TEMP/urls.json")"

        # Tidy drops expired state only, so the live certificate stays readable.
        vault write "$PKI_MOUNT/tidy" safety_buffer=1s > /dev/null
        expect "tidy keeps a live certificate" "$leaf_serial" \
          "$(vault read -field=serial_number "$PKI_MOUNT/cert/$leaf_serial")"

    - name: Dump Vault server log
      if: always()
      run: |
        cat "$RUNNER_TEMP/vault.log" || true
        pkill -f "vault server -dev" || true
